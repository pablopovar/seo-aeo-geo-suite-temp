[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:opengsc]
directory=/suite/opengsc
command=npm start
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PORT="4017",DATABASE_URL="file:/suite/data/opengsc/prod.db",NEXTAUTH_URL="http://localhost:4017"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:dashboard]
directory=/suite/dashboard
command=/opt/venvs/dashboard/bin/python app.py
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
environment=PORT="4018",SEO_DB="/suite/data/opengsc/prod.db",RESEARCH_DB="/suite/data/dashboard/research.db",REPORTS_DIR="/suite/reports",AEO_AUDITOR_URL="http://127.0.0.1:4019",AEO_AUDIT_COMMAND=""
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:aeo_geo_auditor]
directory=/suite/aeo-geo-auditor
command=/opt/venvs/aeo/bin/gunicorn --bind 0.0.0.0:4019 app:app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
